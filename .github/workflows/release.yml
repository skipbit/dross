# Publishes a GitHub release for a version tag.
#
# The tag is where the version comes from (see cmake/ProjectVersion.cmake), so
# a release is cut by pushing one. The build and the tests run again here
# because the version is resolved at configure time and only exists once the
# tag does -- the run that passed on the branch built a different version of
# the same code.

name: Release

on:
  push:
    tags:
      # Deliberately broader than a release tag. A mistyped tag (v1.0, v2)
      # has to fail somewhere visible: narrowing this to the release shape
      # would start no run at all, and the only evidence of the mistake would
      # be a release that never appeared.
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # creating the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version is derived from git tags, which a shallow checkout
          # does not carry: without the history the build reports 0.0.0.
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Before the build, because dross.pc is written at configure time and a
      # tag that cannot produce a version should not spend the test suite.
      #
      # A tag that does not reach the build is what this guards: a shallow
      # checkout, a tag the release pattern rejects, or a rename would each
      # leave the library claiming 0.0.0 while the release says otherwise.
      #
      # Only the numeric triple can be checked. A library's version is that
      # triple -- it is what SOVERSION, dross.pc and drossConfigVersion.cmake
      # carry -- so two pre-releases of the same release are indistinguishable
      # here by construction, not by oversight.
      - name: Check the configured version against the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"
          actual="$(sed -n 's/^Version: //p' build/dross.pc)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the build reports $actual, the tag says $expected"
            exit 1
          fi
          echo "version $actual matches $GITHUB_REF_NAME"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # gtest_discover_tests leaves a placeholder that fails when the test
      # binary is missing, so an unbuilt test tree surfaces as a failing test.
      # --no-tests=error covers the remaining case, a tree that registered
      # nothing at all, which exits 0 by default.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j"$(nproc)"

      # An existing release is an error rather than a no-op: a tag that was
      # moved and re-pushed would otherwise pass every check above and leave
      # the stale release in place, reported as success.
      #
      # --verify-tag: without it gh creates the tag when it is missing, at the
      # default branch's head, publishing a release for a commit that was
      # never built here.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; delete it before re-running"
            exit 1
          fi

          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
