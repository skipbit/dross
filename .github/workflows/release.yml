# Publishes a GitHub release for a version tag.
#
# The tag is where the version comes from (see cmake/ProjectVersion.cmake), so
# a release is cut by pushing one. The build and the tests run again here
# rather than trusting the branch checks: a tag can point at any commit, and
# the version baked into the library only exists once the tag does.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # creating the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version is derived from git tags, which a shallow checkout
          # does not carry: without the history the build reports 0.0.0.
          fetch-depth: 0

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      # gtest_discover_tests registers a placeholder that fails when the test
      # binary is missing, so an unbuilt test tree surfaces as a failing test.
      # --no-tests=error covers the remaining case, a tree that registered
      # nothing at all, which exits 0 by default.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j"$(nproc)"

      # A tag that does not reach the build is the failure this guards: a
      # shallow checkout, a tag that does not match the pattern, or a rename
      # would all leave the library claiming 0.0.0 while the release says
      # otherwise.
      - name: Check the built version against the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"
          actual="$(sed -n 's/^Version: //p' build/dross.pc)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the build reports $actual, the tag says $expected"
            exit 1
          fi
          echo "version $actual matches $GITHUB_REF_NAME"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--generate-notes)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
