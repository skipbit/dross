# Checks a commit against the Requirements in the README: every supported
# compiler and standard library pairing, in both build types, the two ways the
# library is packaged, what the sanitizers find, and that the documentation
# still builds. `required` waits for all of them, so one name stands for the
# whole list.
#
# Toolchains come only from the pinned runner images and the distribution's own
# repositories, so an upstream change cannot break a check here. Newer
# toolchains are watched by nightly.yml instead.

name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request supersedes its earlier run. Every other run has
# a group of its own, so pushes to main and releases are checked in full. The
# workflow name is part of the key: a run started by a caller reports the
# caller's event, and would otherwise share a group with the direct run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build & test (${{ matrix.toolchain.name }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        toolchain:
          # GCC starts at 13 on ubuntu-24.04. Clang starts at 20 on ubuntu-26.04:
          # older releases cannot build this library against the libstdc++
          # ubuntu-24.04 pairs them with.
          #
          # stdlib is the macro the standard library defines about itself,
          # with the release where a job pins one.
          - { name: 'linux, gcc-13', os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, stdlib: '_GLIBCXX_RELEASE 13' }
          - { name: 'linux, gcc-15', os: ubuntu-26.04, cc: gcc-15, cxx: g++-15, stdlib: '_GLIBCXX_RELEASE 15' }
          # The runner's default libstdc++, which most Clang users on Linux
          # build against. Its release is reported, not asserted on: a change
          # of image is news, not a failure.
          - { name: 'linux, clang-20', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: _GLIBCXX_RELEASE }
          - { name: 'linux, clang-22', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: _GLIBCXX_RELEASE }
          # The rest of the libstdc++ range. Which release Clang uses does not
          # follow from its version, so each one is pinned.
          - { name: 'linux, clang-20, libstdc++-13', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: '_GLIBCXX_RELEASE 13', packages: libstdc++-13-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' }
          - { name: 'linux, clang-20, libstdc++-14', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: '_GLIBCXX_RELEASE 14', packages: libstdc++-14-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' }
          - { name: 'linux, clang-22, libstdc++-13', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: '_GLIBCXX_RELEASE 13', packages: libstdc++-13-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' }
          - { name: 'linux, clang-22, libstdc++-14', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: '_GLIBCXX_RELEASE 14', packages: libstdc++-14-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' }
          # libc++ at both ends of the Clang range.
          - { name: 'linux, clang-20, libc++', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: _LIBCPP_VERSION, packages: 'libc++-20-dev libc++abi-20-dev', flags: '-stdlib=libc++' }
          - { name: 'linux, clang-22, libc++', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: _LIBCPP_VERSION, packages: 'libc++-22-dev libc++abi-22-dev', flags: '-stdlib=libc++' }
          # The Apple Clang that ships with each OS release, against the libc++
          # that comes with it.
          - { name: 'macos-15', os: macos-15, stdlib: _LIBCPP_VERSION }
          - { name: 'macos-26', os: macos-26, stdlib: _LIBCPP_VERSION }
    # The toolchain goes through the environment so that the presets stay free
    # of CMAKE_CXX_FLAGS: CMake ignores CXXFLAGS once the cache sets it.
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      CXXFLAGS: ${{ matrix.toolchain.flags }}
      LDFLAGS: ${{ matrix.toolchain.flags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The version comes from the tags, and a shallow checkout fetches
          # none of them: a tagged commit would otherwise be built as 0.0.0.
          fetch-tags: true

      - name: Install the standard library
        if: matrix.toolchain.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.toolchain.packages }}

      - name: Report toolchain versions
        run: |
          "${CXX:-c++}" --version
          if [ "$RUNNER_OS" = macOS ]; then xcrun --show-sdk-version; fi
          cmake --version

      # The preprocessor's own answer, rather than the include search path:
      # this is the release the build compiles against, with the flags the
      # build uses. A job that names a release fails unless it gets that one.
      - name: Check the standard library the compiler sees
        run: |
          read -r -a flags <<< "${CXXFLAGS:-}"
          macros=$(echo '#include <version>' | "${CXX:-c++}" -std=c++23 "${flags[@]}" -x c++ -dM -E -)
          seen=$(grep -E '^#define (_GLIBCXX_RELEASE|_LIBCPP_VERSION) ' <<< "$macros" | tr '\n' ' ')
          if ! grep -Eq '^#define ${{ matrix.toolchain.stdlib }}( |$)' <<< "$macros"; then
            echo "::error::expected ${{ matrix.toolchain.stdlib }}, the compiler defines $seen"
            exit 1
          fi
          echo "the compiler defines $seen"

      - name: Build and test
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          CMAKE_BUILD_PARALLEL_LEVEL=$jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset ${{ matrix.preset }}

      # The name says which compiler, and CMake's own record of the one it
      # chose is the evidence. The macOS jobs name an OS release and take the
      # compiler that comes with it, so they have nothing to compare.
      - name: Check the compiler the build used
        if: matrix.toolchain.cxx
        run: |
          used=$(sed -n 's/^CMAKE_CXX_COMPILER:FILEPATH=//p' build/${{ matrix.preset }}/CMakeCache.txt)
          if [ "${used##*/}" != "$CXX" ]; then
            echo "::error::the build used $used, not $CXX"
            exit 1
          fi
          echo "the build used $used"

      # CMake ignores CXXFLAGS and LDFLAGS once the cache sets what they
      # initialise, and the build is green either way, so what the cache holds
      # is read back.
      - name: Check the flags reached the build
        if: matrix.toolchain.flags
        run: |
          cache=build/${{ matrix.preset }}/CMakeCache.txt
          carries() {
            value=$(sed -n "s/^$1:STRING=//p" "$cache")
            if ! grep -qF -- "$2" <<< "$value"; then
              echo "::error::$1 is '$value', without '$2'"
              exit 1
            fi
            echo "$1 carries $2"
          }
          carries CMAKE_CXX_FLAGS "$CXXFLAGS"
          carries CMAKE_EXE_LINKER_FLAGS "$LDFLAGS"
          carries CMAKE_SHARED_LINKER_FLAGS "$LDFLAGS"

  # The two ways the library reaches a consumer: built as a static library,
  # and installed for find_package and pkg-config to describe. Both are the
  # same on either platform, so one job covers them with the runner's own
  # compiler.
  packaging:
    name: packaging (${{ matrix.platform.name }}, ${{ matrix.kind }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-15 }
        kind: [static, install]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # What is installed carries the version, which comes from git tags:
          # a shallow checkout would package 0.0.0.
          fetch-depth: 0

      - name: Report toolchain versions
        run: |
          c++ --version
          if [ "$RUNNER_OS" = macOS ]; then xcrun --show-sdk-version; fi
          cmake --version

      - name: Build and test the static library
        if: matrix.kind == 'static'
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          CMAKE_BUILD_PARALLEL_LEVEL=$jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset static

      - name: Build and install
        if: matrix.kind == 'install'
        run: |
          cmake --preset release
          cmake --build --preset release --parallel "$(getconf _NPROCESSORS_ONLN)"
          sudo cmake --install build/release

      - name: Build a consumer through find_package
        if: matrix.kind == 'install'
        run: |
          mkdir consumer && cd consumer
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(dross REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE dross::dross)
          EOF

          cat > main.cpp << 'EOF'
          #include <dross/dross.h>
          #include <iostream>

          int main() {
              dross::number n{"42"};
              std::cout << "Test passed: " << static_cast<std::string>(n) << std::endl;
              return 0;
          }
          EOF

          cmake -S . -B build
          cmake --build build
          printed=$(./build/consumer)
          if [ "$printed" != "Test passed: 42" ]; then
            echo "::error::the consumer printed '$printed'"
            exit 1
          fi
          echo "the consumer printed $printed"

      # What was installed has to describe the version the build describes,
      # which comes from the tags through the one implementation of it.
      - name: Query pkg-config
        if: matrix.kind == 'install'
        run: |
          pkg-config --version
          pkg-config --exists dross
          cmake -D "SOURCE_DIR=$PWD" -D "OUTPUT=$RUNNER_TEMP/version" -P cmake/PrintVersion.cmake
          expected=$(sed -n 2p "$RUNNER_TEMP/version")
          reported=$(pkg-config --modversion dross)
          if [ "$reported" != "$expected" ]; then
            echo "::error::pkg-config reports $reported, expected $expected"
            exit 1
          fi
          echo "pkg-config reports $reported"
          pkg-config --cflags dross
          pkg-config --libs dross

  # One pairing carries the sanitizers: the newest Clang against the runner's
  # own libstdc++, in a debug build. What they report is the point, so the
  # flags and the runtime they pull in are checked as well.
  sanitize:
    name: sanitize (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - { name: address, flag: '-fsanitize=address,undefined', symbols: '__asan_init __ubsan_handle_' }
          - { name: thread, flag: '-fsanitize=thread', symbols: '__tsan_init' }
    env:
      CC: clang-22
      CXX: clang++-22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # As above: without the tags the build calls itself 0.0.0.
          fetch-tags: true

      - name: Report toolchain versions
        run: |
          "$CXX" --version
          cmake --version

      - name: Build and test
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          CMAKE_BUILD_PARALLEL_LEVEL=$jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset sanitize-${{ matrix.sanitizer.name }}

      # Tests that pass say nothing about a sanitizer that was never built in.
      - name: Check the sanitizer is built in
        run: |
          build=build/sanitize-${{ matrix.sanitizer.name }}
          flags=$(sed -n 's/^CMAKE_CXX_FLAGS:STRING=//p' "$build/CMakeCache.txt")
          if ! grep -qF -- '${{ matrix.sanitizer.flag }}' <<< "$flags"; then
            echo "::error::CMAKE_CXX_FLAGS is '$flags', without '${{ matrix.sanitizer.flag }}'"
            exit 1
          fi
          echo "CMAKE_CXX_FLAGS carries ${{ matrix.sanitizer.flag }}"
          for binary in "$build/src/libdross.so" "$build/test/dross_test"; do
            for symbol in ${{ matrix.sanitizer.symbols }}; do
              count=$(nm -D "$binary" | grep -c "$symbol" || true)
              if [ "$count" -eq 0 ]; then
                echo "::error::$binary references no $symbol"
                exit 1
              fi
              echo "$binary references $count $symbol symbols"
            done
          done

  # The documentation is built from the same sources the library is, so a
  # change that breaks it is caught here rather than when it is published.
  # Its links and formatting are checked nightly instead: both follow
  # releases and sites this repository does not control.
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The documented version comes from git tags, which a shallow
          # checkout does not carry.
          fetch-depth: 0

      # $GITHUB_ENV rather than an export: each run block is its own shell, so
      # the Sphinx step would not see a variable the Doxygen step set. Through
      # the same implementation the library build uses, so the documented
      # version cannot describe a different tag.
      - name: Resolve the documented version
        run: |
          cmake -D "SOURCE_DIR=$PWD" -D "OUTPUT=$RUNNER_TEMP/version" -P cmake/PrintVersion.cmake
          resolved="$(sed -n 1p "$RUNNER_TEMP/version")"
          echo "DROSS_VERSION=$resolved" >> "$GITHUB_ENV"
          echo "Version: $resolved"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          pip install -r docs/sphinx/requirements.txt

      - name: Generate Doxygen documentation
        run: |
          mkdir -p docs/build/doxygen
          cd docs/doxygen
          doxygen Doxyfile

      - name: Build Sphinx documentation
        run: |
          cd docs/sphinx
          make html

      # Sphinx reports a missing reference as a warning and still exits 0, so
      # what the build produced is checked rather than its exit status alone.
      - name: Check the documentation was produced
        run: |
          test -s docs/build/doxygen/xml/index.xml
          test -s docs/build/sphinx/html/index.html
          echo "$(find docs/build/doxygen/xml -name '*.xml' | wc -l) Doxygen files"
          echo "$(find docs/build/sphinx/html -name '*.html' | wc -l) HTML pages"

  required:
    name: required
    if: always()
    needs: [build-and-test, packaging, sanitize, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # A job that failed, was cancelled or was skipped all fail this one, so
      # a check that never ran cannot pass as success.
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
