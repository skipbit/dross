# Checks a commit against the Requirements in the README: every supported
# compiler and standard library pairing, in both build types. `required` waits
# for all of them, so one name stands for the whole list.
#
# Toolchains come only from the pinned runner images and the distribution's own
# repositories, so an upstream change cannot break a check here. Newer
# toolchains are watched by nightly.yml instead.

name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request supersedes its earlier run. Every other run has
# a group of its own, so pushes to main and releases are checked in full.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build & test (${{ matrix.toolchain.name }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        toolchain:
          # GCC starts at 13 on ubuntu-24.04. Clang starts at 20 on ubuntu-26.04:
          # older releases cannot build this library against the libstdc++
          # ubuntu-24.04 pairs them with.
          - { name: 'linux, gcc-13', os: ubuntu-24.04, cc: gcc-13, cxx: g++-13 }
          - { name: 'linux, gcc-15', os: ubuntu-26.04, cc: gcc-15, cxx: g++-15 }
          # The runner's default libstdc++, which most Clang users on Linux
          # build against.
          - { name: 'linux, clang-20', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: libstdc++ }
          - { name: 'linux, clang-22', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: libstdc++ }
          # The rest of the libstdc++ range. Which release Clang uses does not
          # follow from its version, so each one is pinned.
          - { name: 'linux, clang-20, libstdc++-13', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: libstdc++, packages: libstdc++-13-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' }
          - { name: 'linux, clang-20, libstdc++-14', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, stdlib: libstdc++, packages: libstdc++-14-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' }
          - { name: 'linux, clang-22, libstdc++-13', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: libstdc++, packages: libstdc++-13-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13' }
          - { name: 'linux, clang-22, libstdc++-14', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, stdlib: libstdc++, packages: libstdc++-14-dev, flags: '--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14' }
          # libc++ at both ends of the Clang range.
          - { name: 'linux, clang-20, libc++', os: ubuntu-26.04, cc: clang-20, cxx: clang++-20, packages: 'libc++-20-dev libc++abi-20-dev', flags: '-stdlib=libc++' }
          - { name: 'linux, clang-22, libc++', os: ubuntu-26.04, cc: clang-22, cxx: clang++-22, packages: 'libc++-22-dev libc++abi-22-dev', flags: '-stdlib=libc++' }
          # The Apple Clang that ships with each OS release.
          - { name: 'macos-15', os: macos-15 }
          - { name: 'macos-26', os: macos-26 }
    # The toolchain goes through the environment so that the presets stay free
    # of CMAKE_CXX_FLAGS: CMake ignores CXXFLAGS once the cache sets it.
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      CXXFLAGS: ${{ matrix.toolchain.flags }}
      LDFLAGS: ${{ matrix.toolchain.flags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install the standard library
        if: matrix.toolchain.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.toolchain.packages }}

      - name: Report toolchain versions
        run: |
          "${CXX:-c++}" --version
          if [ "$RUNNER_OS" = macOS ]; then xcrun --show-sdk-version; fi
          cmake --version

      - name: Check the libstdc++ Clang selects
        if: matrix.toolchain.stdlib == 'libstdc++'
        run: .github/scripts/check-libstdcxx.sh

      - name: Build and test
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          CMAKE_BUILD_PARALLEL_LEVEL=$jobs CTEST_PARALLEL_LEVEL=$jobs cmake --workflow --preset ${{ matrix.preset }}

      - name: Check the flags reached the build
        if: matrix.toolchain.flags
        run: .github/scripts/check-build-flags.sh build/${{ matrix.preset }} "$CXXFLAGS"

  required:
    name: required
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # A job that failed, was cancelled or was skipped all fail this one, so
      # a check that never ran cannot pass as success.
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
