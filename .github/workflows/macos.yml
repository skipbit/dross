name: macOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# macOS users build with the Apple Clang that ships with the OS, so the OS
# generation is the axis worth varying: pinning to the two current releases
# covers two Apple Clang generations without a separate compiler axis.

jobs:
  build-macos-clang:
    name: macOS Clang Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v7

    - name: Report toolchain versions
      run: |
        clang --version
        xcrun --show-sdk-version
        cmake --version

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j"$(sysctl -n hw.ncpu)"

    - name: Test
      run: ./build/test/dross_test --gtest_color=yes

  build-static-library:
    name: macOS Static Library Build
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake (Static)
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF

    - name: Build
      run: cmake --build build -j"$(sysctl -n hw.ncpu)"

    - name: Test
      run: ./build/test/dross_test --gtest_color=yes

  install-test:
    name: macOS Installation Test
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Build and Install
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j"$(sysctl -n hw.ncpu)"
        sudo cmake --install build

    - name: Test find_package
      run: |
        mkdir test-client && cd test-client
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(test_client CXX)
        set(CMAKE_CXX_STANDARD 23)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        find_package(dross REQUIRED)
        add_executable(test_client main.cpp)
        target_link_libraries(test_client PRIVATE dross::dross)
        EOF

        cat > main.cpp << 'EOF'
        #include <dross/dross.h>
        #include <iostream>

        int main() {
            dross::number n{"42"};
            std::cout << "Test passed: " << static_cast<std::string>(n) << std::endl;
            return 0;
        }
        EOF

        cmake -S . -B build
        cmake --build build
        ./build/test_client

    - name: Test pkg-config
      run: |
        pkg-config --exists dross
        pkg-config --modversion dross
        pkg-config --cflags dross
        pkg-config --libs dross
