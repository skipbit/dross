name: macOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-macos-clang:
    name: macOS Clang Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15]
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew update
        brew install cmake

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j$(sysctl -n hw.ncpu)

    - name: Test
      run: ./build/test/dross_test --gtest_color=yes

  build-macos-gcc:
    name: macOS GCC Build
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        gcc_version: [13, 14]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies and GCC ${{ matrix.gcc_version }}
      run: |
        brew update
        brew install cmake gcc@${{ matrix.gcc_version }}

    - name: Configure CMake
      run: |
        # Find GCC path (different for Intel and Apple Silicon)
        if [ -x "/usr/local/bin/gcc-${{ matrix.gcc_version }}" ]; then
          GCC_PATH="/usr/local/bin"
        elif [ -x "/opt/homebrew/bin/gcc-${{ matrix.gcc_version }}" ]; then
          GCC_PATH="/opt/homebrew/bin"
        else
          echo "GCC ${{ matrix.gcc_version }} not found"
          exit 1
        fi

        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=$GCC_PATH/gcc-${{ matrix.gcc_version }} \
          -DCMAKE_CXX_COMPILER=$GCC_PATH/g++-${{ matrix.gcc_version }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j$(sysctl -n hw.ncpu)

    - name: Test
      run: ./build/test/dross_test --gtest_color=yes

  build-static-library:
    name: macOS Static Library Build
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew update
        brew install cmake

    - name: Configure CMake (Static)
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Test
      run: ./build/test/dross_test --gtest_color=yes

  install-test:
    name: macOS Installation Test
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew update
        brew install cmake pkg-config

    - name: Build and Install
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(sysctl -n hw.ncpu)
        sudo cmake --install build

    - name: Test find_package
      run: |
        mkdir test-client && cd test-client
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(test_client CXX)
        set(CMAKE_CXX_STANDARD 23)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        find_package(dross REQUIRED)
        add_executable(test_client main.cpp)
        target_link_libraries(test_client PRIVATE dross::dross)
        EOF

        cat > main.cpp << 'EOF'
        #include <dross/dross.h>
        #include <iostream>

        int main() {
            dross::number n{"42"};
            std::cout << "Test passed: " << static_cast<std::string>(n) << std::endl;
            return 0;
        }
        EOF

        cmake -S . -B build
        cmake --build build
        ./build/test_client

    - name: Test pkg-config
      run: |
        pkg-config --exists dross
        pkg-config --modversion dross
        pkg-config --cflags dross
        pkg-config --libs dross
