name: macOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# What is left here builds the library the two ways it is distributed on
# macOS: as a static library, and installed for a consumer to find. The Apple
# Clang generations are checked in check.yml.

jobs:
  build-static-library:
    name: macOS Static Library Build
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake (Static)
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF

    - name: Build
      run: cmake --build build -j"$(sysctl -n hw.ncpu)"

    - name: Test
      run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(sysctl -n hw.ncpu)"

  install-test:
    name: macOS Installation Test
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Report toolchain versions
      run: |
        cmake --version
        pkg-config --version

    - name: Build and Install
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j"$(sysctl -n hw.ncpu)"
        sudo cmake --install build

    - name: Test find_package
      run: |
        mkdir test-client && cd test-client
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(test_client CXX)
        set(CMAKE_CXX_STANDARD 23)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        find_package(dross REQUIRED)
        add_executable(test_client main.cpp)
        target_link_libraries(test_client PRIVATE dross::dross)
        EOF

        cat > main.cpp << 'EOF'
        #include <dross/dross.h>
        #include <iostream>

        int main() {
            dross::number n{"42"};
            std::cout << "Test passed: " << static_cast<std::string>(n) << std::endl;
            return 0;
        }
        EOF

        cmake -S . -B build
        cmake --build build
        ./build/test_client

    - name: Test pkg-config
      run: |
        pkg-config --exists dross
        pkg-config --modversion dross
        pkg-config --cflags dross
        pkg-config --libs dross
