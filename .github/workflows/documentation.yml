name: Documentation

# Publishes the documentation Check built, once every check on a push to main
# has passed, so the pages never come from a commit that failed one.
#
# The two files meet only by name: the workflow name Check, and the
# documentation-html artifact the docs job in check.yml keeps. Renaming either
# side stops publishing.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # A slower Check of an earlier push, or one re-run later, would otherwise
  # publish older pages over newer ones.
  tip:
    name: still the tip of main
    # Only a push: the branch filter above matches the head branch of a run,
    # which a pull request from a fork's main also has.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.compare.outputs.current }}

    steps:
      - name: Compare the checked commit with main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$CHECKED" ]; then
            echo "publishing $CHECKED"
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "not publishing $CHECKED: main is now at $tip"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-24.04

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      actions: read     # to download the documentation from the Check run
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v8
        with:
          name: documentation-html
          path: ./html
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
